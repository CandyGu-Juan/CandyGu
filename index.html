<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>客户信息统计（在线版）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#3B3833; --ink2:#5B554C; --ink3:#8A8478; --paper:#F7F5F1;
  --line:#E7E2D9; --line2:#EFEBE3; --white:#fff;
}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:var(--paper); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1240px;margin:0 auto;padding:34px 24px 70px}

/* ── 头部 ── */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:24px}
h1{font-size:23px;font-weight:600;letter-spacing:.01em}
.sub{font-size:13px;color:var(--ink3);margin-top:7px}
.head-r{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid transparent;border-radius:9px;padding:9px 16px;font-size:13px;
  cursor:pointer;font-family:inherit;font-weight:500;transition:.18s;white-space:nowrap}
.btn.primary{background:var(--ink);color:#FBF9F6}
.btn.primary:hover{background:#24221E}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink2)}
.btn.ghost:hover{border-color:#C9C0B0;background:#FCFAF7}

/* ── 统计 ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:16px 18px;
  animation:rise .45s ease both}
.stat:nth-child(2){animation-delay:.05s}
.stat:nth-child(3){animation-delay:.1s}
.stat:nth-child(4){animation-delay:.15s}
.stat .k{font-size:12px;color:var(--ink3);letter-spacing:.05em}
.stat .v{font-size:27px;font-weight:600;margin-top:7px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v small{font-size:12px;font-weight:400;color:var(--ink3);margin-left:5px;letter-spacing:0}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── 工具栏 ── */
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.search{position:relative;flex:1;min-width:230px;max-width:390px}
.search input{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;
  padding:0 14px 0 36px;font-size:13px;background:#fff;outline:none;font-family:inherit;color:var(--ink);transition:.18s}
.search input:focus{border-color:#B9AF9E;box-shadow:0 0 0 3px rgba(185,175,158,.15)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;stroke:#A69E90;fill:none;stroke-width:1.7}
.filters{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-left:auto}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;
  font-size:12.5px;color:var(--ink2);cursor:pointer;font-family:inherit;transition:.15s}
.chip:hover{border-color:#C9C0B0}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
.sel{height:34px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:12.5px;
  font-family:inherit;color:var(--ink2);background:#fff;cursor:pointer;outline:none}
.sel:focus{border-color:#B9AF9E}

/* ── 客户分组卡 ── */
.group{background:#fff;border:1px solid var(--line2);border-radius:14px;overflow:hidden;
  margin-bottom:14px;box-shadow:0 1px 2px rgba(61,56,48,.035);animation:rise .4s ease both}
.ghead{display:flex;align-items:center;gap:10px;padding:13px 18px;
  background:var(--hd);border-left:4px solid var(--c)}
.ghead .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.ghead h2{font-size:14.5px;font-weight:600;color:var(--tx);letter-spacing:.01em}
.ghead .cnt{font-size:12px;color:var(--tx);opacity:.62;margin-left:2px}
.ghead-r{margin-left:auto;display:flex;gap:8px}
.mini{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95);border-radius:7px;
  padding:5px 11px;font-size:12px;color:var(--tx);cursor:pointer;font-family:inherit;transition:.15s}
.mini:hover{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1300px}
th{text-align:left;font-weight:500;font-size:11.5px;color:var(--ink3);letter-spacing:.06em;
  padding:10px 14px;background:#FCFBF8;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.92);background:var(--bg);
  vertical-align:top;transition:background .15s}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--bg2)}
.cell-co{font-size:12px;color:#7C766C;line-height:1.45}
.cell-code{font-variant-numeric:tabular-nums;font-size:12px;color:#6E685E;letter-spacing:.04em;white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace}
.cell-name{font-weight:600;letter-spacing:.01em;white-space:nowrap}
.cell-title{color:#5E584F;word-break:break-word;line-height:1.45}
.cell-tel{font-variant-numeric:tabular-nums;letter-spacing:.02em;white-space:nowrap;color:#4C473F}
.cell-mail{font-size:12.5px;color:#6A645A;word-break:break-all}
.cell-addr{font-size:12.5px;color:#6A645A;line-height:1.5}
.badge{display:inline-block;padding:2.5px 9px;border-radius:6px;font-size:11.5px;font-weight:600;
  border:1px solid rgba(0,0,0,.045)}
.pill{display:inline-block;padding:2.5px 9px;border-radius:6px;font-size:11.5px;white-space:nowrap}
.ops{text-align:right;white-space:nowrap;width:84px}
.ops button{opacity:0;transition:.15s;border:none;background:transparent;font-family:inherit;
  font-size:12px;color:#8A8478;cursor:pointer;padding:2px 5px;border-radius:5px}
tr:hover .ops button{opacity:1}
.ops button:hover{color:var(--ink);background:rgba(0,0,0,.045)}
.ops button.del:hover{color:#A65A4E}
.empty{text-align:center;padding:70px 20px;color:var(--ink3);font-size:13.5px;display:none}
.empty.on{display:block}

/* ── 弹窗 ── */
.mask{position:fixed;inset:0;background:rgba(46,42,36,.34);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
.mask.on{display:flex}
.dlg{background:#FDFCFA;border-radius:16px;width:100%;max-width:660px;max-height:88vh;overflow:auto;
  box-shadow:0 24px 64px rgba(40,36,30,.24);padding:26px 28px 22px;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.dlg h3{font-size:16px;font-weight:600;margin-bottom:4px}
.dlg .hint{font-size:12.5px;color:var(--ink3);margin-bottom:20px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field.span2{grid-column:span 2}
.field label{font-size:12px;color:var(--ink3);letter-spacing:.04em}
.field input,.field select,.field textarea{height:38px;border:1px solid var(--line);border-radius:9px;
  padding:0 12px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);outline:none;transition:.18s}
.field textarea{height:auto;padding:9px 12px;resize:vertical;min-height:62px;line-height:1.55}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:#B9AF9E;box-shadow:0 0 0 3px rgba(185,175,158,.15)}
.dlg-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;padding-top:18px;
  border-top:1px solid var(--line2)}
.foot{margin-top:26px;text-align:center;font-size:12px;color:#A8A196;letter-spacing:.02em}

@media(max-width:860px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .filters{margin-left:0;width:100%}
  .app{padding:24px 16px 56px}
  h1{font-size:20px}
  .col-tel,.col-mail,.col-addr,.col-status,.col-last{display:none}
  table{min-width:640px}
  .cell-title{word-break:normal}
}
@media(max-width:520px){
  .col-code,.col-co{display:none}
  table{min-width:340px}
}
@media(max-width:780px){
  .fgrid{grid-template-columns:1fr}
  .field.full,.field.span2{grid-column:auto}
}
@media(hover:none){.ops button{opacity:1}}

/* ── 访问口令 ── */
body.locked{overflow:hidden}
body.locked .app{visibility:hidden}
#gate{position:fixed;inset:0;background:#F7F5F1;display:flex;align-items:center;
  justify-content:center;padding:24px;z-index:999}
#gate .card{background:#fff;border:1px solid #E7E2D9;border-radius:18px;
  padding:36px 38px 28px;width:100%;max-width:376px;box-shadow:0 24px 64px rgba(40,36,30,.10);
  text-align:center}
#gate .strip{display:flex;gap:5px;justify-content:center;margin-bottom:20px}
#gate .strip i{width:22px;height:5px;border-radius:3px;display:block}
#gate h2{font-size:17px;font-weight:600;color:#3B3833;letter-spacing:.01em}
#gate .sub{font-size:12.5px;color:#8A8478;margin:7px 0 22px}
#gate input{width:100%;height:42px;border:1px solid #E3DDD3;border-radius:10px;
  padding:0 14px;font-size:14px;font-family:inherit;text-align:center;letter-spacing:.14em;
  outline:none;background:#fff;color:#3B3833;transition:.18s}
#gate input:focus{border-color:#B9AF9E;box-shadow:0 0 0 3px rgba(185,175,158,.15)}
#gate .btn{width:100%;margin-top:14px;height:42px;border-radius:10px}
#gate .err{min-height:18px;margin-top:10px;font-size:12px;color:#A65A4E}

@media print{
  body{background:#fff}
  .head-r,.toolbar,.ops,.mini,.foot{display:none !important}
  .app{padding:0;max-width:none}
  .group{break-inside:avoid;box-shadow:none;margin-bottom:10px}
  th,td{padding:7px 10px}
}
</style>
</head>
<body class="locked">
<div id="gate">
  <div class="card">
    <div class="strip">
      <i style="background:#DFA8B2"></i><i style="background:#9DC29A"></i>
      <i style="background:#A2BCDB"></i><i style="background:#E3CB8C"></i>
      <i style="background:#C8AFA8"></i><i style="background:#9CB3B1"></i>
    </div>
    <h2>客户信息统计</h2>
    <p class="sub">请输入访问口令后查看</p>
    <input id="gateInput" type="password" placeholder="访问口令" autocomplete="off"/>
    <button class="btn primary" id="gateBtn">进入</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div class="app">

  <header class="head">
    <div>
      <h1>客户信息统计</h1>
      <p class="sub" id="subline">按客户分组 · 莫兰迪底纹区分</p>
    </div>
    <div class="head-r">
      <button class="btn ghost" id="btnExport">导出 Excel</button>
      <button class="btn ghost" id="btnPrint">打印</button>
      <button class="btn primary" id="btnAdd">+ 新增客户信息</button>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
      <input id="q" type="text" placeholder="搜索公司、姓名、职位、电话、地址…"/>
    </div>
    <div class="filters">
      <button class="chip active" data-lv="all">全部</button>
      <button class="chip" data-lv="A">A 级</button>
      <button class="chip" data-lv="B">B 级</button>
      <button class="chip" data-lv="C">C 级</button>
      <select class="sel" id="statusSel"><option value="">全部状态</option></select>
    </div>
  </div>

  <main id="board"></main>
  <div class="empty" id="empty">没有匹配的记录，换个关键词试试</div>

  <p class="foot">数据已加密存储于 GitHub 仓库 · 多设备实时同步 · 请妥善保管口令与令牌</p>
</div>

<div class="mask" id="mask">
  <div class="dlg" id="dlg">
    <h3 id="dlgTitle">新增客户信息</h3>
    <p class="hint">填写公司与联系人信息，保存后自动按公司配色归档</p>
    <div class="fgrid">
      <div class="field">
        <label>客户编码</label>
        <input id="f-code" placeholder="如 8100438"/>
      </div>
      <div class="field span2">
        <label>公司名称 *</label>
        <input id="f-company" list="companyList" placeholder="例如：云启数据科技（上海）有限公司"/>
        <datalist id="companyList"></datalist>
      </div>
      <div class="field">
        <label>客户名称 *</label>
        <input id="f-name" placeholder="联系人姓名"/>
      </div>
      <div class="field">
        <label>职位</label>
        <input id="f-title" placeholder="例如：技术总监"/>
      </div>
      <div class="field">
        <label>客户等级</label>
        <select id="f-level"><option value="A">A 级（重点）</option><option value="B" selected>B 级（潜力）</option><option value="C">C 级（一般）</option></select>
      </div>
      <div class="field">
        <label>手机</label>
        <input id="f-phone" placeholder="138-0000-0000"/>
      </div>
      <div class="field">
        <label>座机</label>
        <input id="f-tel" placeholder="021-0000-0000"/>
      </div>
      <div class="field">
        <label>跟进状态</label>
        <select id="f-status"></select>
      </div>
      <div class="field span2">
        <label>邮箱</label>
        <input id="f-email" placeholder="name@company.com"/>
      </div>
      <div class="field">
        <label>最近联系</label>
        <input id="f-last" type="date"/>
      </div>
      <div class="field full">
        <label>地址</label>
        <input id="f-address" placeholder="省 / 市 / 区 / 详细地址"/>
      </div>
      <div class="field full">
        <label>备注</label>
        <textarea id="f-note" placeholder="合作背景、需求要点、注意事项…"></textarea>
      </div>
    </div>
    <div class="dlg-foot">
      <button class="btn ghost" id="btnCancel">取消</button>
      <button class="btn primary" id="btnSave">保存</button>
    </div>
  </div>

<script>
(function(){
  'use strict';

  var PALETTE=['#DFA8B2','#9DC29A','#A2BCDB','#E3CB8C','#C8AFA8','#A9B7A4','#A3B2C2','#C9B79C','#B2A6BE','#9CB3B1','#C9A695','#ADB68F','#C3A8B2','#A8ADB1'];

  var ST_COLOR={'初步接洽':'#8A8478','需求确认':'#78866F','方案沟通':'#76839A','商务谈判':'#95805F','已签约':'#6D7F68','暂缓跟进':'#9B8C8C'};
  var LV_COLOR={'A':['#8C6B5D','rgba(140,107,93,.10)'],'B':['#6F7A66','rgba(111,122,102,.10)'],'C':['#8A8478','rgba(138,132,120,.10)']};
  var LS_KEY='crm_stat_sheet_v3';

  var rows=[], colorMap={}, filterLv='all', filterStatus='', kw='', editing=null;
  var $=function(s){return document.querySelector(s)};

  /* ── 工具函数 ── */
  function uid(){return Math.random().toString(36).slice(2,9)}
  function hex2rgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}
  function rgb2hex(r,g,b){return '#'+[r,g,b].map(function(v){return ('0'+Math.round(v).toString(16)).slice(-2)}).join('')}
  function mix(a,b,t){var A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t)}
  function rgba(h,a){var c=hex2rgb(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
  function daysAgo(n){var d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)}
  function todayStr(){return new Date().toISOString().slice(0,10)}

  function tone(c){return {
    c:c, bg:mix(c,'#FFFFFF',0.74), bg2:mix(c,'#FFFFFF',0.66),
    hd:mix(c,'#FFFFFF',0.58), tx:mix(c,'#000000',0.62)
  }}
  function colorOf(company){
    if(!(company in colorMap)) colorMap[company]=Object.keys(colorMap).length % PALETTE.length;
    return PALETTE[colorMap[company] % PALETTE.length];
  }

  /* ── 数据 ── */
  function buildRows(raw){
    return raw.map(function(r){
      var o={id:uid(),code:r.code||'',company:r.company,name:r.name,title:r.title,phone:r.phone,tel:r.tel||'',
        email:r.email,address:r.address,level:r.level,status:r.status,
        last:(r.days==null?(r.last||''):daysAgo(r.days)),note:r.note};
      return o;
    });
  }
  function save(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){
      ghSave({rows:rows,colorMap:colorMap}).catch(function(e){setSync('err',e.message)});
    },1200);
  }
  function load(){
    var raw=null;
    try{raw=localStorage.getItem(LS_KEY)}catch(e){}
    if(raw){
      try{
        var o=JSON.parse(raw);rows=o.rows||[];colorMap=o.colorMap||{};

      }catch(e){}
    }

  function migrate(){
    rows.forEach(function(r){
      if(typeof r.tel!=='string') r.tel='';
      if(typeof r.code!=='string') r.code='';
      if(r.phone && /^0\d{2,3}-/.test(r.phone) && !r.tel){ r.tel=r.phone; r.phone=''; }
    });
    /* 旧数据：客户编码可能只存在于备注里 */
    rows.forEach(function(r){
      if(r.code) return;
      var m=/(?:^|·\s*)账号\s*(\d{5,})/.exec(r.note||'');
      if(m) r.code=m[1];
    });
    var cmap={};
    rows.forEach(function(r){ if(r.code) cmap[r.company]=r.code; });
    rows.forEach(function(r){ if(!r.code && cmap[r.company]) r.code=cmap[r.company]; });
    rows.forEach(function(r){
      if(r.note) r.note=r.note.replace(/账号\s*\d{5,}\s*·\s*/,'').replace(/^[\s·｜]+/,'');
    });
  }

  /* ── 筛选 ── */
  function getFiltered(){
    var k=kw.trim().toLowerCase();
    return rows.filter(function(r){
      if(filterLv!=='all' && r.level!==filterLv) return false;
      if(filterStatus && r.status!==filterStatus) return false;
      if(!k) return true;
      return [r.code,r.company,r.name,r.title,r.phone,r.tel,r.email,r.address,r.note,r.status]
        .join(' ').toLowerCase().indexOf(k)>-1;
    });
  }
  function groupBy(list){
    var map=new Map();
    list.forEach(function(r){
      if(!map.has(r.company)) map.set(r.company,[]);
      map.get(r.company).push(r);
    });
    return Array.from(map,function(e){return {company:e[0],rows:e[1]}});
  }

  /* ── 渲染 ── */
  function renderStats(){
    var comps={}, aCnt=0, recent=0, real=0;
    var d30=new Date();d30.setDate(d30.getDate()-30);
    rows.forEach(function(r){
      comps[r.company]=1;
      if(!r.name && !r.email) return;
      real++;
      if(r.level==='A') aCnt++;
      if(r.last && new Date(r.last)>=d30) recent++;
    });
    var data=[
      ['客户（家）',Object.keys(comps).length,''],
      ['联系人（位）',real,''],
      ['A 级联系人',aCnt,'位'],
      ['近 30 天跟进',recent,'位']
    ];
    $('#stats').innerHTML=data.map(function(d){
      return '<div class="stat"><div class="k">'+d[0]+'</div><div class="v">'+d[1]+
        (d[2]?'<small>'+d[2]+'</small>':'')+'</div></div>';
    }).join('');
    $('#subline').textContent='共 '+Object.keys(comps).length+' 家客户 · '+real+
      ' 位联系人 · 按公司分组，莫兰迪底纹区分';
  }

  /* ── 云端同步（GitHub 仓库存储） ── */
  var GH={owner:'CandyGu-Juan',repo:'CandyGu',branch:'main',path:'data.json'};
  var GHPW='',GHSHA=null,saveTimer=null;
  var TOKEN_KEY='kehu_gh_pat';

  function ghToken(){try{return localStorage.getItem(TOKEN_KEY)||''}catch(e){return ''}}
  function b64u8(b64){var bin=atob(b64),u8=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return u8}
  function u8b64(u8){var s='';for(var i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s)}
  async function deriveKey(pw,salt,iter){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  }
  async function encryptJson(obj,pw){
    var salt=crypto.getRandomValues(new Uint8Array(16));
    var iv=crypto.getRandomValues(new Uint8Array(12));
    var iter=150000;
    var key=await deriveKey(pw,salt,iter);
    var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(JSON.stringify(obj)));
    return {salt:u8b64(salt),iv:u8b64(iv),iter:iter,ct:u8b64(new Uint8Array(ct))};
  }
  async function decryptEnc(enc,pw){
    var key=await deriveKey(pw,b64u8(enc.salt),enc.iter);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(enc.iv)},key,b64u8(enc.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  function ghApi(){return 'https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/contents/'+GH.path}
  async function ghGet(){
    var r=await fetch(ghApi()+'?ref='+GH.branch,{headers:{'Accept':'application/vnd.github+json'},cache:'no-store'});
    if(r.status===404)return null;
    if(!r.ok)throw new Error('HTTP '+r.status);
    var j=await r.json();
    var raw=atob(j.content.replace(/\n/g,''));
    return {sha:j.sha,enc:JSON.parse(raw)};
  }
  function setSync(state,msg){
    var el=document.getElementById('syncTxt');
    if(!el)return;
    var t=new Date();
    var hh=function(n){return (n<10?'0':'')+n};
    var now=hh(t.getHours())+':'+hh(t.getMinutes())+':'+hh(t.getSeconds());
    var map={
      loading:['正在获取云端数据…','#8A8478'],
      ok:['☁ 已连接云端 · 上次保存 '+now,'#4C7A4C'],
      saving:['正在保存到云端…','#8A6D3B'],
      ro:['只读模式 · 点击「设置同步令牌」后可编辑并自动保存','#8A8478'],
      err:['⚠ 同步异常：'+(msg||'') ,'#A65A4E']
    };
    var m=map[state]||['','#666'];
    el.textContent=m[0];el.style.color=m[1];
  }
  function initSyncBar(){
    if(document.getElementById('syncbar'))return;
    var head=document.querySelector('header.head');
    if(!head)return;
    var bar=document.createElement('div');bar.id='syncbar';
    bar.style.cssText='display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 0;'+
      'padding:9px 14px;border:1px solid #E7E2D9;border-radius:10px;background:#FCFAF6;font-size:12.5px';
    bar.innerHTML='<span id="syncTxt">…</span><span style="flex:1"></span>'+
      '<button id="btnSync" style="border:1px solid #D8D1C4;background:#fff;border-radius:8px;'+
      'padding:5px 12px;font-size:12px;color:#4C473F;cursor:pointer;font-family:inherit">立即同步</button>'+
      '<button id="btnTok" style="border:1px solid #D8D1C4;background:#fff;border-radius:8px;'+
      'padding:5px 12px;font-size:12px;color:#4C473F;cursor:pointer;font-family:inherit">设置同步令牌</button>';
    head.after(bar);
    document.getElementById('btnSync').addEventListener('click',function(){
      ghSave({rows:rows,colorMap:colorMap}).catch(function(e){setSync('err',e.message)});
    });
    document.getElementById('btnTok').addEventListener('click',setToken);
  }
  async function setToken(){
    var t=prompt('粘贴 GitHub 个人访问令牌（Fine-grained Token，需对仓库 '+GH.repo+
      ' 有 Contents 读写权限）。\n令牌仅保存在本设备浏览器，不会上传。',ghToken()||'');
    if(t===null)return;
    t=(t||'').trim();
    if(!t){try{localStorage.removeItem(TOKEN_KEY)}catch(e){};setSync('ro');return}
    /* 用仓库元信息验证令牌（data.json 首次尚不存在，不能用它验证） */
    var r=await fetch('https://api.github.com/repos/'+GH.owner+'/'+GH.repo,
      {headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+t},cache:'no-store'});
    if(r.status===401||r.status===403){alert('令牌无效或无权限（HTTP '+r.status+'），请检查令牌与仓库权限');return}
    if(!r.ok){alert('验证异常（HTTP '+r.status+'），请稍后重试');return}
    try{localStorage.setItem(TOKEN_KEY,t)}catch(e){}
    setSync('saving');
    ghSave({rows:rows,colorMap:colorMap}).catch(function(e){setSync('err',e.message)});
  }
  async function ghSave(obj){
    var tok=ghToken();
    if(!tok){setSync('ro');return}
    setSync('saving');
    var enc=await encryptJson(obj,GHPW);
    var json=JSON.stringify(enc);
    var payload={message:'客户数据自动保存',content:u8b64(new TextEncoder().encode(json)),branch:GH.branch};
    if(GHSHA)payload.sha=GHSHA;
    var opt={method:'PUT',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+tok,
      'Content-Type':'application/json'},body:JSON.stringify(payload)};
    var r=await fetch(ghApi(),opt);
    if((r.status===409||r.status===422)){
      /* 云端已被其他设备更新：取最新 sha 覆盖（以当前设备为准） */
      var m=await ghGet().catch(function(){return null});
      if(m){payload.sha=m.sha;r=await fetch(ghApi(),opt);}
    }
    if(!r.ok){
      var t2='';try{t2=(await r.json()).message}catch(e){}
      throw new Error('HTTP '+r.status+(t2?' '+t2:''));
    }
    var j=await r.json();GHSHA=j.content.sha;
    setSync('ok');
  }

  (function(){
    var ENC=JSON.parse(document.getElementById('enc-data').textContent);
    var gate=document.getElementById('gate');
    var input=document.getElementById('gateInput');
    var err=document.getElementById('gateErr');
    var btn=document.getElementById('gateBtn');

    function b64u8(b64){
      var bin=atob(b64),u8=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
      return u8;
    }
    function unlock(raw,pw){
      gate.style.display='none';
      document.body.classList.remove('locked');
      initSyncBar();
      setSync('loading');
      cloudBoot(raw,pw);
    }
    async function cloudBoot(raw,pw){
      GHPW=pw;
      try{
        var remote=await ghGet();
        if(remote){
          GHSHA=remote.sha;
          var data=await decryptEnc(remote.enc,pw);
          rows=buildRows(data.rows||data);
          colorMap=data.colorMap||{};
          if(typeof migrate==='function')migrate();
        }else{
          rows=buildRows(raw);
        }
        setSync(ghToken()?'ok':'ro');
      }catch(e){
        rows=buildRows(raw);
        setSync('err','读取云端失败('+e.message+')，当前显示内置数据');
      }
      bind();render();
    }
    async function attempt(){
      var pw=input.value.trim();
      if(!pw){err.textContent='请输入访问口令';return}
      btn.disabled=true;btn.textContent='验证中…';err.textContent='';
      try{
        var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),
          'PBKDF2',false,['deriveKey']);
        var key=await crypto.subtle.deriveKey(
          {name:'PBKDF2',salt:b64u8(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},
          base,{name:'AES-GCM',length:256},false,['decrypt']);
        var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(ENC.iv)},key,b64u8(ENC.ct));
        unlock(JSON.parse(new TextDecoder().decode(plain)),pw);
      }catch(e){
        err.textContent='口令不正确，请重新输入';
        input.value='';input.focus();
        btn.disabled=false;btn.textContent='进入';
      }
    }
    if(!window.crypto||!crypto.subtle){
      err.textContent='当前浏览器不支持解密，请使用 Chrome 或 Edge 打开';
    }
    btn.addEventListener('click',attempt);
    input.addEventListener('keydown',function(e){if(e.key==='Enter')attempt()});
    setTimeout(function(){input.focus()},80);
  })();
})();
